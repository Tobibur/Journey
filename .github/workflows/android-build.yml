name: Build and Release APK

on:
  push:
    branches:
      - master  # Runs whenever you push to main branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Get last commit info
        id: last_commit
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          {
            echo 'message<<EOF'
            git log -1 --pretty=format:'%s'
            echo
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Delete existing latest tag
        run: git push origin :refs/tags/latest || true

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest Build (${{ steps.last_commit.outputs.short_sha }})"
          body: |
            **Last commit:** ${{ steps.last_commit.outputs.message }}
            **Commit:** ${{ github.sha }}
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
          removeArtifacts: true


